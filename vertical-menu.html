<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Dropdown Dọc</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        #menu ul {
            margin: 0;
            padding: 0;
        }

        #menu li {
            list-style: none;
            position: relative;
            width: 100px;
            height: 30px;
            padding: 0 20px;
            background-color: black;
            line-height: 30px;
            cursor: pointer;
        }

        #menu li a {
            text-decoration: none;
            color: white;
        }

        #menu li:hover {
            background-color: #555;
        }

        /* Menu con */
        #menu li ul {
            position: absolute;
            top: 0;
            left: 160px;
            visibility: hidden;
        }

        /* Hiển thị menu con khi di chuột vào mục cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>

<body>

    <div id="menu">
        <ul>
            <li>
                <a href="#">Home</a>
            </li>

            <li>
                <a href="#">Products</a>
                <ul>
                    <li><a href="#">Product 1</a></li>
                    <li><a href="#">Product 2</a></li>
                    <li><a href="#">Product 3</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Services</a>
                <ul>
                    <li><a href="#">Service 1</a></li>
                    <li><a href="#">Service 2</a></li>
                    <li><a href="#">Service 3</a></li>
                </ul>
            </li>

            <li>
                <a href="#">About</a>
            </li>

            <li>
                <a href="#">Contact</a>
            </li>
        </ul>
    </div>

</body>
</html>
