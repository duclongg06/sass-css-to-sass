<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Grid</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="overlay">
<div class="gridcontainer">
<div class="gridwrapper header-wrapper">
<div class="gridcontent header-content">
</div>
</div>
<div class="gridwrapper main-wrapper">
  <div class="gridcontent sidebar-left">
    <div class="sidebar-item"></div>
    <div class="sidebar-item"></div>
    <div class="sidebar-item"></div>
    <div class="sidebar-item-last"></div>
  </div>
  <div class="gridcontent col-bg"></div>
  <div class="gridcontent col-bg"></div>
  <div class="gridcontent col-bg"></div>
  <div class="gridcontent col-bg"></div>
  <div class="gridcontent col-bg"></div>
  <div class="gridcontent col-bg"></div>
  <div class="gridcontent sidebar-right">
    <div class="sidebar-right-item"></div>
  </div>
</div>
<div class="gridwrapper footer-wrapper">
  <div class="gridcontent footer-content">
  </div>
</div>

</div>
</div>
<div class="gridcontainer bg-grid-container">
<div class="gridwrapper bg-wrapper">
  <div class="gridcontent bg-col-first"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
  <div class="gridcontent bg-col"></div>
</div>
</div>

<p>Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>

</body>
</html>
